name: Joplin nightly sync
description: |
  POST joplin-auto /api/sync at 03:00, then ntfy success or failure.
  Secret joplin_setup_token (SETUP_API_TOKEN). Variable ntfy_channel.
scripts:
  - script: plugin/joplin-api
    config:
      url: http://10.8.0.6:3040/api/sync
      method: POST
      token: $SECRET_joplin_setup_token
      timeoutMs: 600000
  - set:
      expression: |
        {
          "title": data.ok ? "Joplin sync ok" : "Joplin sync failed",
          "message": data.message
        }
  - script: ntfy.js
    config:
      url: $VAR_ntfy_channel
triggers:
  - type: cron
    schedule: "0 3 * * *"
  - type: HTTP
    method: POST
    path: /dev-joplin-sync
enabled: false
