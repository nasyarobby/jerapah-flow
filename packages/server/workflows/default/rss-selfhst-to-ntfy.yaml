name: RSS - selfh.st first item to ntfy
scripts:
  - script: fetch-rss-feed.js
    config:
      url: "https://selfh.st/rss/"
      outputVar: item
      jsonata: items[0]
  - script: fingerprint.js
    config:
      key: selfhst-latest
      jsonata: "data.item.guid ? data.item.guid : data.item.link"
  - script: jsonata.js
    config:
      expression: |
        {
          "data": {
            "title": item.title,
            "message": item.contentSnippet & "\n" & item.link,
            "attach": item.mediaContent.url ? item.mediaContent.url : (item.mediaContent.$ ? item.mediaContent.$.url : undefined)
          }
        }
  - script: ntfy.js
    config:
      url: https://ntfy.sh/scrunner

triggers:
  - type: HTTP
    method: POST
    path: /selfhst-rss
