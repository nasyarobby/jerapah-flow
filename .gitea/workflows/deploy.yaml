name: Deploy to Raspberry Pi

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: home   # must match a label on your act_runner
    steps:
      - name: Deploy
        run: |
          set -euo pipefail

          # act_runner uses bash --noprofile --norc; load nvm/pnpm explicitly
          export NVM_DIR="/home/nsrb/.nvm"
          export PNPM_HOME="/home/nsrb/.local/share/pnpm"
          # shellcheck disable=SC1091
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          export PATH="$PNPM_HOME/bin:$PATH"

          APP_DIR=/home/nsrb/apps/jerapah-flow
          cd "$APP_DIR"

          git fetch origin dev
          git checkout dev
          git pull --ff-only origin dev

          pnpm install --frozen-lockfile
          pnpm build

          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save